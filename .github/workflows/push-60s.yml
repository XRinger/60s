name: Daily 60s → Telegram

# ============================================================
# 用途：每天定时抓取「60秒读懂世界」新闻，推送到 Telegram
#
# 部署前必做（GitHub 网页操作，2 分钟）：
#   Settings → Secrets and variables → Actions → New repository secret
#     BOT_TOKEN = 你的 Telegram Bot Token（找 @BotFather 创建）
#     CHAT_ID   = 你的 Chat ID（给 bot 发条消息，访问
#                 https://api.telegram.org/bot<TOKEN>/getUpdates 找到
#                 "chat":{"id":xxx}，群组是负数，私聊是正数）
#
# 手动测试：Actions 页面 → Run workflow（无需等定时）
# ============================================================

on:
  schedule:
    # 每天北京时间上午 10:00 推送（GitHub cron 用 UTC：02:00 UTC = 10:00 北京）
    # 60s 数据通常上午 10 点前更新完毕，10 点推送基本能拿到当天最新
    - cron: '0 2 * * *'
  workflow_dispatch: # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: read

concurrency:
  group: push-60s
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取 60s 新闻文本
        id: fetch
        env:
          # 默认用官方公共 API；若你自部署了 60s，可在仓库 Variables 里设置
          # SIXTY_API_URL = https://你的域名/v2/60s?encoding=text 覆盖
          API_URL: ${{ vars.SIXTY_API_URL || 'https://60s.viki.moe/v2/60s?encoding=text' }}
        run: |
          TEXT="$(curl -sfL --max-time 30 "$API_URL" || true)"
          if [ -z "${TEXT}" ]; then
            echo "::error::60s API 返回为空，请稍后重试或检查 SIXTY_API_URL"
            exit 1
          fi
          # Telegram 单条消息上限 4096 字符，做个截断保护
          TEXT="${TEXT:0:3900}"
          # 写入临时文件，避免换行/特殊字符在变量传递中被吞掉
          printf '%s' "$TEXT" > "${RUNNER_TEMP}/sixty_text.txt"
          echo "fetched ok (${#TEXT} chars)"

      - name: 组装并发送到 Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 去掉 Secret 粘贴时可能带入的空白/换行（常见坑：值末尾带 \n 会被 Telegram 拒为 chat not found）
          BOT_TOKEN="${BOT_TOKEN//[$'\r\n\t ']/}"
          CHAT_ID="${CHAT_ID//[$'\r\n\t ']/}"
          echo "BOT_TOKEN length: ${#BOT_TOKEN}"
          echo "CHAT_ID length: ${#CHAT_ID}"

          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::error::请先在仓库 Settings → Secrets 添加 BOT_TOKEN 和 CHAT_ID"
            exit 1
          fi

          # 北京时间 日期 + 中文星期
          WEEKDAY="$(date -u -d '+8 hours' +%u)" # 1=周一 ... 7=周日
          case "${WEEKDAY}" in
            1) WD="周一" ;; 2) WD="周二" ;; 3) WD="周三" ;;
            4) WD="周四" ;; 5) WD="周五" ;; 6) WD="周六" ;;
            7) WD="周日" ;;
          esac
          DATE_LABEL="$(date -u -d '+8 hours' +"%Y年%m月%d日") · ${WD}"

          # HTML parse_mode 下转义内容中的 & < >
          ESC="$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "${RUNNER_TEMP}/sixty_text.txt")"

          MESSAGE="$(printf '%s\n\n%s\n\n- via 60s API' "📰 <b>${DATE_LABEL} · 60秒读懂世界</b>" "${ESC}")"

          HTTP_CODE="$(curl -sS -o "${RUNNER_TEMP}/tg_resp.json" -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true)"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Telegram 发送失败 (HTTP ${HTTP_CODE})"
            cat "${RUNNER_TEMP}/tg_resp.json"
            exit 1
          fi
          echo "telegram sent ok"
name: Daily 60s → Telegram

# ============================================================
# 用途：每天定时抓取「60秒读懂世界」新闻，推送到 Telegram
#
# 部署前必做（GitHub 网页操作，2 分钟）：
#   Settings → Secrets and variables → Actions → New repository secret
#     BOT_TOKEN = 你的 Telegram Bot Token（找 @BotFather 创建）
#     CHAT_ID   = 你的 Chat ID（给 bot 发条消息，访问
#                 https://api.telegram.org/bot<TOKEN>/getUpdates 找到
#                 "chat":{"id":xxx}，群组是负数，私聊是正数）
#
# 可选 - 关键词筛选（只推你关心的内容，随时可改，不用动代码）：
#   Settings → Secrets and variables → Actions → Variables → New variable
#     NEWS_KEYWORDS = 科技,AI,汽车   （逗号分隔；留空/不配 = 推送全部）
#
# 可选 - 换数据源（把整条推送换成其他主题接口）：
#     SIXTY_API_URL = https://60s.viki.moe/v2/it-news?encoding=text&limit=10
#                     其他：ai-news / zhihu / weibo / toutiao / bili 等，text 格式即可
#
# 手动测试：Actions 页面 → Run workflow（无需等定时）
# ============================================================

on:
  schedule:
    # 每天北京时间上午 10:00 推送（GitHub cron 用 UTC：02:00 UTC = 10:00 北京）
    # 60s 数据通常上午 10 点前更新完毕，10 点推送基本能拿到当天最新
    - cron: '0 2 * * *'
  workflow_dispatch: # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: read

concurrency:
  group: push-60s
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取 60s 新闻文本
        id: fetch
        env:
          # 默认用官方公共 API；若你自部署了 60s，可在仓库 Variables 里设置
          # SIXTY_API_URL = https://你的域名/v2/60s?encoding=text 覆盖
          API_URL: ${{ vars.SIXTY_API_URL || 'https://60s.viki.moe/v2/60s?encoding=text' }}
        run: |
          TEXT="$(curl -sfL --max-time 30 "$API_URL" || true)"
          if [ -z "${TEXT}" ]; then
            echo "::error::60s API 返回为空，请稍后重试或检查 SIXTY_API_URL"
            exit 1
          fi
          # Telegram 单条消息上限 4096 字符，做个截断保护
          TEXT="${TEXT:0:3900}"
          # 写入临时文件，避免换行/特殊字符在变量传递中被吞掉
          printf '%s' "$TEXT" > "${RUNNER_TEMP}/sixty_text.txt"
          echo "fetched ok (${#TEXT} chars)"

      - name: 组装并发送到 Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 关键词筛选：逗号分隔（如 "科技,AI,汽车"），留空 = 不过滤推送全部
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
        run: |
          # 去掉 Secret 粘贴时可能带入的空白/换行（常见坑：值末尾带 \n 会被 Telegram 拒为 chat not found）
          BOT_TOKEN="${BOT_TOKEN//[$'\r\n\t ']/}"
          CHAT_ID="${CHAT_ID//[$'\r\n\t ']/}"
          echo "BOT_TOKEN length: ${#BOT_TOKEN}"
          echo "CHAT_ID length: ${#CHAT_ID}"

          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::error::请先在仓库 Settings → Secrets 添加 BOT_TOKEN 和 CHAT_ID"
            exit 1
          fi

          # 北京时间 日期 + 中文星期
          WEEKDAY="$(date -u -d '+8 hours' +%u)" # 1=周一 ... 7=周日
          case "${WEEKDAY}" in
            1) WD="周一" ;; 2) WD="周二" ;; 3) WD="周三" ;;
            4) WD="周四" ;; 5) WD="周五" ;; 6) WD="周六" ;;
            7) WD="周日" ;;
          esac
          DATE_LABEL="$(date -u -d '+8 hours' +"%Y年%m月%d日") · ${WD}"

          # ===== 关键词筛选 =====
          # 只保留正文包含任一关键词的条目，重新编号；无匹配时退回推送全部
          FILTERED=""
          if [ -n "${NEWS_KEYWORDS}" ]; then
            echo "${NEWS_KEYWORDS}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' > "${RUNNER_TEMP}/keywords.txt"
            ITEMS="$(grep -E '^[0-9]+\. ' "${RUNNER_TEMP}/sixty_text.txt")"
            MATCHED="$(printf '%s\n' "${ITEMS}" | grep -F -i -f "${RUNNER_TEMP}/keywords.txt")"
            TOTAL_COUNT="$(printf '%s\n' "${ITEMS}" | grep -c .)"
            if [ -n "${MATCHED}" ]; then
              FILTERED="$(printf '%s\n' "${MATCHED}" | awk '{ sub(/^[0-9]+\. /, NR". "); print }')"
              MATCH_COUNT="$(printf '%s\n' "${FILTERED}" | grep -c .)"
              echo "关键词筛选: 匹配 ${MATCH_COUNT} 条 / 共 ${TOTAL_COUNT} 条"
            else
              echo "关键词无匹配，将推送全部 ${TOTAL_COUNT} 条"
            fi
          fi

          # 组装正文（筛选结果优先，否则全部；仅筛选时补微语，避免全文回退时重复）
          if [ -n "${FILTERED}" ]; then
            BODY="${FILTERED}"
            FILTER_NOTE="（已筛选：${NEWS_KEYWORDS}）"
          else
            BODY="$(cat "${RUNNER_TEMP}/sixty_text.txt")"
            FILTER_NOTE=""
          fi
          QUOTE="$(grep '【微语】' "${RUNNER_TEMP}/sixty_text.txt" || true)"
          if [ -n "${FILTERED}" ] && [ -n "${QUOTE}" ]; then
            BODY="${BODY}"$'\n\n'"${QUOTE}"
          fi

          # HTML parse_mode 下转义内容中的 & < >
          ESC="$(printf '%s' "${BODY}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')"

          MESSAGE="$(printf '%s\n\n%s\n\n- via 60s API' "📰 <b>${DATE_LABEL} · 60秒读懂世界${FILTER_NOTE}</b>" "${ESC}")"

          HTTP_CODE="$(curl -sS -o "${RUNNER_TEMP}/tg_resp.json" -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true)"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Telegram 发送失败 (HTTP ${HTTP_CODE})"
            cat "${RUNNER_TEMP}/tg_resp.json"
            exit 1
          fi
          echo "telegram sent ok"
name: Daily News → Telegram

# ============================================================
# 用途：按【主题】抓取新闻，每个主题精选 5 条。每条新闻独立推送一条消息：
#   [配图（如有）] → 加粗中文标题 → 中文正文 → 来源链接 → 分类名
#   例如：
#     🖼️（有图时）
#     <b>苹果将 iPhone X 列为过时，停止所有硬件维修</b>
#     苹果更新了停产与过时产品列表，iPhone X 被归为过时产品……
#     [9To5Mac 链接]
#     🤖 AI            ← 分类行：emoji + 分类名（emoji 可配置，可省）
#
# 必做（GitHub 网页操作，只需一次）：
#   Settings → Secrets and variables → Actions → New repository secret
#     BOT_TOKEN = Telegram Bot Token（@BotFather 创建）
#     CHAT_ID   = 你的 Chat ID（getUpdates 里 "chat":{"id":xxx}）
#
# 可选：主题覆盖（不配置则使用内置默认，内置已含 31 个可用新闻源）
#   Settings → Secrets and variables → Actions → Variables → New variable
#   Name:  THEMES   Value: {"AI":{"max":5,"keywords":"","sources":[
#     "https://...", {"label":"某源","url":"https://..."}]},"科技":{...}}
#   - 键的顺序 = 推送顺序；sources 可为字符串 URL 或 {"label","url"} 对象
#   - 可选 emoji 字段 = 每条消息末尾的分类标签（如 "AI":{"emoji":"🤖"}，默认内置）
#   - 支持的源类型：RSS / Atom / JSON 数组（含 title 字段）/ Bing News RSS
#   - 正文来源优先级：RSS description → 抓原文正文首段 → 无正文仅标题
#   - 图片来源：Bing News:Image / media:content / media:thumbnail / enclosure
#   - max = 每主题最终推送条数（默认 5）：全部源汇总后按源顺序轮换精选，每条来自不同源
#   - keywords 逗号分隔，留空 = 全部条目参与精选；非空 = 只精选含任一关键词的条目（无匹配则跳过该主题）
#   - 英文内容自动翻译为简体中文（Google 翻译，无需任何密钥）；中文内容原样保留
#
# 手动测试：Actions 页面 → Run workflow（无需等定时）
# ============================================================

on:
  schedule:
    # 每天北京时间上午 10:00 推送（GitHub cron 用 UTC：02:00 UTC = 10:00 北京）
    - cron: '0 2 * * *'
  workflow_dispatch: # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: read

concurrency:
  group: push-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 抓取各主题新闻并推送到 Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 可选的主题覆盖 JSON（见文件头注释；不设置则用内置默认）
          THEMES: ${{ vars.THEMES }}
        run: |
          python3 - <<'PYEOF'
          import html, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from xml.etree import ElementTree as ET

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("CHAT_ID", "").strip()
          THEMES_RAW = (os.environ.get("THEMES") or "").strip()

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"}

          # ---------- 内置默认主题（31 个已实测可用的源；THEMES 变量可整体覆盖） ----------
          def bing(q):
              # Bing News RSS：英文端点可同时返回中/英文新闻，description 自带摘要，
              # 条目带 <News:Image> 缩略图
              return "https://www.bing.com/news/search?q={}&format=rss&cc=us&setlang=en-us".format(urllib.parse.quote(q))

          DEFAULT_THEMES = {
              "AI": {"max": 5, "keywords": "", "emoji": "🤖", "sources": [
                  {"label": "OpenAI",      "url": "https://openai.com/news/rss.xml"},
                  {"label": "Anthropic",   "url": bing("Anthropic")},
                  {"label": "DeepMind",    "url": bing("DeepMind")},
                  {"label": "NVIDIA",      "url": "https://blogs.nvidia.com/feed/"},
                  {"label": "HF Blog",     "url": "https://huggingface.co/blog/feed.xml"},
                  {"label": "HF Papers",   "url": "https://huggingface.co/api/papers"},
                  {"label": "arXiv AI",    "url": "http://export.arxiv.org/rss/cs.AI"},
                  {"label": "HackerNews",  "url": "https://news.ycombinator.com/rss"},
                  {"label": "MIT TechRev", "url": "https://www.technologyreview.com/feed/"},
                  {"label": "LatentSpace", "url": "https://www.latent.space/feed"},
              ]},
              "科技": {"max": 5, "keywords": "", "emoji": "🚀", "sources": [
                  {"label": "ReutersTech", "url": bing("site:reuters.com technology")},
                  {"label": "TechCrunch",  "url": "https://techcrunch.com/feed/"},
                  {"label": "TheVerge",    "url": "https://www.theverge.com/rss/index.xml"},
                  {"label": "ArsTechnica", "url": "https://feeds.arstechnica.com/arstechnica/index"},
                  {"label": "IEEESpectrum","url": "https://spectrum.ieee.org/feeds/feed.rss"},
                  {"label": "SemiAnalysis","url": "https://www.semianalysis.com/rss/"},
                  {"label": "TheRegister", "url": "https://www.theregister.com/headlines.atom"},
                  {"label": "WIRED",       "url": "https://www.wired.com/feed/rss"},
                  {"label": "HackerNews",  "url": "https://news.ycombinator.com/rss"},
                  {"label": "Lobsters",    "url": "https://lobste.rs/newest.rss"},
              ]},
              "eVtol": {"max": 5, "keywords": "", "emoji": "🚁", "sources": [
                  {"label": "ReutersAero", "url": bing("site:reuters.com aerospace")},
                  {"label": "FlightGlobal","url": bing("site:flightglobal.com")},
                  {"label": "AvWeek",      "url": bing("site:aviationweek.com")},
                  {"label": "AIN",         "url": bing("site:ainonline.com")},
                  {"label": "eVTOL",       "url": bing("eVTOL")},
                  {"label": "VertMag",     "url": "https://verticalmag.com/feed/"},
                  {"label": "低空经济",    "url": bing("低空经济")},
              ]},
              "股市": {"max": 5, "keywords": "", "emoji": "📈", "sources": [
                  {"label": "ReutersMkt",  "url": bing("site:reuters.com markets")},
                  {"label": "FT Markets",  "url": bing("site:ft.com markets")},
                  {"label": "A股",         "url": bing("A股 沪指")},
                  {"label": "港股",        "url": bing("港股 恒生指数")},
              ]},
          }

          # ---------- 基础函数 ----------
          def bj_now():
              return datetime.now(timezone.utc) + timedelta(hours=8)

          def fetch(url, timeout=25):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="replace")

          def unescape2(s):
              # 双重解码 HTML 实体（处理 &amp;#x27; 这类嵌套转义）
              return html.unescape(html.unescape(s or ""))

          def clean(s):
              return re.sub(r"\s+", " ", s or "").strip()

          def strip_html(s):
              return clean(re.sub(r"<[^>]+>", " ", s or ""))

          def strip_src_suffix(t):
              # 去掉标题末尾的 " - 来源名"（条目已带来源标签）
              return re.sub(r"\s-\s[\w .'&+'-]+\Z", "", t).strip() or t

          def host(url):
              try:
                  h = urllib.parse.urlparse(url).netloc
                  return "GoogleNews" if h == "news.google.com" else re.sub(r"^www\.", "", h)
              except Exception:
                  return url[:20]

          def parse_feed(url, body):
              # JSON 数组（如 HuggingFace papers）
              try:
                  data = json.loads(body)
                  if isinstance(data, list):
                      return [(clean(strip_src_suffix(it["title"])), it.get("url") or "",
                               clean(it.get("summary") or it.get("description") or ""), "")
                              for it in data if isinstance(it, dict) and it.get("title")]
              except Exception:
                  pass
              # RSS / Bing News RSS：按 <item> 正则切分
              # （Bing 的 xmlns:News 命名空间是动态查询 URL，不能用 ElementTree 命名空间查询）
              items = re.findall(r"(?s)<item>.*?</item>", body)
              if items:
                  entries = []
                  for raw in items:
                      m = re.search(r"<title>(.*?)</title>", raw, re.S)
                      if not m:
                          continue
                      t = strip_html(unescape2(m.group(1)))
                      t = strip_src_suffix(t)
                      if not t:
                          continue
                      lk = re.search(r"<link>(.*?)</link>", raw, re.S)
                      ln = unescape2(lk.group(1)).strip() if lk else ""
                      ds = re.search(r"<description>(.*?)</description>", raw, re.S)
                      d = strip_html(unescape2(ds.group(1) if ds else "")) if ds else ""
                      # 图片：Bing News:Image → media:content → media:thumbnail → enclosure
                      img = ""
                      mi = re.search(r"<News:Image>(.*?)</News:Image>", raw, re.S)
                      if mi:
                          img = html.unescape(mi.group(1)).strip()
                      if not img:
                          mc = re.search(r'<media:content[^>]*url="([^"]+)"', raw)
                          if mc:
                              img = mc.group(1)
                      if not img:
                          mt = re.search(r'<media:thumbnail[^>]*url="([^"]+)"', raw)
                          if mt:
                              img = mt.group(1)
                      if not img:
                          en = re.search(r'<enclosure[^>]*type="image/[^"]*"[^>]*url="([^"]+)"', raw)
                          if en:
                              img = en.group(1)
                      entries.append((t, ln, d, img))
                  return entries
              # Atom 回退
              try:
                  root = ET.fromstring(body)
              except Exception:
                  return []
              ns = {"a": "http://www.w3.org/2005/Atom"}
              out = []
              for it in root.findall(".//a:entry", ns):
                  t = it.findtext("a:title", "", ns)
                  if not t:
                      continue
                  ln = ""
                  for lk in it.findall("a:link", ns):
                      ln = lk.get("href", "")
                      break
                  d = it.findtext("a:summary", "", ns) or ""
                  out.append((clean(strip_src_suffix(t)), ln, clean(d), ""))
              return out

          def desc_valid(desc, title):
              # description 是否为有效摘要（排除与标题重复的垃圾 desc）
              if not desc or len(desc) < 25:
                  return False
              n1 = re.sub(r"[\W_]+", "", desc.lower())
              n2 = re.sub(r"[\W_]+", "", title.lower())
              if n2 and n2 in n1 and len(n1) <= len(n2) + 20:
                  return False
              return True

          def img_ok(url):
              # 验证图片 URL 可公开访问（返回 image 类型），防止发给 Telegram 后失败
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      ct = r.headers.get("Content-Type", "")
                      r.read(1024)
                      return "image" in ct
              except Exception:
                  return False

          UI_WORDS = ("text settings", "story text", "subscribers only", "back to articles",
                      "minimize to nav", "a]:hidden", "sign in", "log in", "subscribe",
                      "cookie", "follow us", "share this", "privacy policy", "ot-pc", "onetrust", "optanon")

          def extract_summary(html_body, max_len=800):
              # 从 HTML 提取正文（优先 <article>/<main> 内的干净段落，拼接多段至 max_len）
              h = re.sub(r"(?is)<(script|style|nav|header|footer|aside|form)[^>]*>.*?</\1>", " ", html_body)
              m = re.search(r"(?is)<(article|main)[^>]*>(.*?)</(article|main)>", h)
              region = m.group(2) if m else h
              paras = re.findall(r"(?is)<p[^>]*>(.*?)</p>", region)
              paras = [clean(unescape2(re.sub(r"<[^>]+>", " ", p))) for p in paras]
              good = [p for p in paras if len(p) >= 40 and not any(w in p.lower() for w in UI_WORDS)]
              if not good:
                  good = [p for p in paras if not any(w in p.lower() for w in UI_WORDS)]
              text = ""
              for p in good:
                  if len(text) + len(p) + 1 > max_len:
                      break
                  text = (text + " " + p).strip()
              if len(text) < 60:
                  text = clean(unescape2(re.sub(r"<[^>]+>", " ", html_body)))
              return text[:max_len]

          def fetch_summary(link, max_len=800):
              # 无 RSS 描述时，抓原文正文作为内容（失败返回空串 → 仅标题）
              try:
                  return extract_summary(fetch(link), max_len)
              except Exception:
                  return ""

          T_CACHE = {}
          def translate_zh(text, _retry=0):
              # 已是中文则跳过；否则用 Google 翻译成简体中文（免费，无需密钥）
              if not text or re.search(r"[\u4e00-\u9fff]", text):
                  return text
              if text in T_CACHE:
                  return T_CACHE[text]
              try:
                  data = urllib.parse.urlencode(
                      {"q": text, "sl": "auto", "tl": "zh-CN", "dt": "t", "client": "gtx"}).encode()
                  req = urllib.request.Request(
                      "https://translate.googleapis.com/translate_a/single", data=data)
                  req.add_header("User-Agent", UA["User-Agent"])
                  with urllib.request.urlopen(req, timeout=15) as r:
                      j = json.loads(r.read().decode("utf-8", errors="replace"))
                  out = "".join(seg[0] for seg in j[0] if seg and seg[0]).strip()
                  T_CACHE[text] = out or text
                  return T_CACHE[text]
              except urllib.error.HTTPError as e:
                  # 限流(429)重试，退避等待
                  if e.code == 429 and _retry < 3:
                      time.sleep(2 * (_retry + 1))
                      return translate_zh(text, _retry + 1)
                  return text
              except Exception:
                  return text

          def pick_top(candidates, order, max_items=5, per_source=3):
              # 轮换精选：按源顺序轮流取（每源最多 per_source 条候选），跨源去重，凑满 max_items
              selected = []
              seen = set()
              for round_i in range(per_source):
                  for label in order:
                      entries = candidates.get(label) or []
                      if round_i < len(entries):
                          t, ln, d, img = entries[round_i]
                          key = re.sub(r"[^\w\u4e00-\u9fff]+", "", t.lower())
                          if key and key not in seen:
                              seen.add(key)
                              selected.append((label, t, ln, d, img))
                              if len(selected) >= max_items:
                                  return selected
              return selected

          def tg_send(text):
              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage", data=data)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return None, str(e)

          def tg_send_photo(img_url, caption):
              # 图片消息（Telegram 服务器自行抓取图片 URL）
              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "photo": img_url,
                  "caption": caption,
                  "parse_mode": "HTML",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendPhoto", data=data)
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return None, str(e)

          # ---------- 启动检查 ----------
          if not BOT_TOKEN or not CHAT_ID:
              print("::error::请先在仓库 Settings → Secrets 添加 BOT_TOKEN 和 CHAT_ID")
              sys.exit(1)

          if THEMES_RAW:
              try:
                  themes = json.loads(THEMES_RAW)
              except Exception as e:
                  print(f"::error::THEMES JSON 解析失败（检查是否为合法 JSON 且单行）: {e}")
                  sys.exit(1)
              if not isinstance(themes, dict) or not themes:
                  print("::error::THEMES 必须是非空 JSON 对象")
                  sys.exit(1)
          else:
              themes = DEFAULT_THEMES

          # ---------- 主流程 ----------
          success = 0
          for name, cfg in themes.items():
              sources = (cfg.get("sources") if isinstance(cfg, dict) else None) or []
              keywords = ((cfg.get("keywords") if isinstance(cfg, dict) else None) or "").strip()
              max_items = int((cfg.get("max") if isinstance(cfg, dict) else None) or 5)
              emoji = (cfg.get("emoji") if isinstance(cfg, dict) else None) or "📰"
              print(f"[{name}] 开始处理，源数: {len(sources)}，精选 {max_items} 条")

              # 1. 逐源抓取 + 解析（每源取前 3 条作为候选）
              candidates = {}
              order = []
              for s in sources:
                  if isinstance(s, dict):
                      src = {"label": str(s.get("label") or host(s.get("url", ""))),
                             "url": str(s.get("url", ""))}
                  else:
                      src = {"label": host(str(s)), "url": str(s).strip()}
                  if not src["url"]:
                      continue
                  try:
                      entries = parse_feed(src["url"], fetch(src["url"]))
                  except Exception as e:
                      print(f"  ✗ {src['label']} 获取失败: {type(e).__name__} {str(e)[:60]}")
                      continue
                  if keywords:
                      kw = [k.lower() for k in keywords.split(",") if k.strip()]
                      entries = [e for e in entries if any(k in e[0].lower() for k in kw)]
                  if entries:
                      candidates[src["label"]] = entries[:3]
                      order.append(src["label"])
                      print(f"  ✓ {src['label']}: 候选 {min(3, len(entries))} 条")
                  else:
                      print(f"  · {src['label']}: 无条目")
              if not candidates:
                  print(f"[{name}] 无可用内容，跳过")
                  continue

              # 2. 轮换精选（每条来自不同源）
              selected = pick_top(candidates, order, max_items=max_items)
              if not selected:
                  print(f"[{name}] 精选为空，跳过")
                  continue
              print(f"[{name}] 已精选 {len(selected)} 条，逐条生成中文内容...")

              # 3. 每条新闻独立推送：图片(如有) → 加粗标题 → 正文 → 来源链接 → 分类 → 分隔线
              for label, t, ln, desc, img in selected:
                  if desc_valid(desc, t):
                      raw = desc[:800]
                  elif ln:
                      raw = fetch_summary(ln)
                  else:
                      raw = ""
                  zh_title = translate_zh(t)
                  zh_sum = translate_zh(raw)[:600].strip() if raw else ""
                  # 兜底解码残留 HTML 实体（页面正文偶发多层转义）
                  zh_title = unescape2(zh_title)
                  zh_sum = unescape2(zh_sum)
                  lines = [f"<b>{html.escape(zh_title)}</b>"]
                  if zh_sum:
                      lines.append(html.escape(zh_sum))
                  if ln:
                      lines.append(f"<a href=\"{html.escape(ln, quote=True)}\">{html.escape(label)}</a>")
                  lines.append(f"{emoji} {name}" if emoji else name)  # 分类行：emoji + 分类名
                  lines.append("────────────")  # 消息分隔线（Telegram 连续消息紧凑无间距）
                  text = "\n\n".join(lines)
                  if img and img_ok(img):
                      status, resp = tg_send_photo(img, text[:1024])
                      if status == 200:
                          success += 1
                          print(f"[{name}] ✅ 图片消息: {label}")
                      else:
                          print(f"[{name}] ⚠️ {label} 图片失败 HTTP {status}，降级为文本")
                          status2, resp2 = tg_send(text)
                          if status2 == 200:
                              success += 1
                          else:
                              print(f"[{name}] ❌ {label} 文本降级失败: HTTP {status2} {resp2}")
                  else:
                      status, resp = tg_send(text)
                      if status == 200:
                          success += 1
                          print(f"[{name}] ✅ 文本消息: {label}")
                      else:
                          print(f"[{name}] ❌ {label} 发送失败: HTTP {status} {resp}")

          if success == 0:
              print("::error::所有主题消息均发送失败")
              sys.exit(1)
          print(f"完成: {success} 条消息发送成功")
          PYEOF

name: Daily News → Telegram

# ============================================================
# 用途：按【主题】抓取新闻，每个主题单独一条消息推送到 Telegram
#
# 必做（GitHub 网页操作）：
#   Settings → Secrets and variables → Actions → New repository secret
#     BOT_TOKEN = Telegram Bot Token（@BotFather 创建）
#     CHAT_ID   = 你的 Chat ID（getUpdates 里 "chat":{"id":xxx}）
#
# 主题配置（单个变量，一行 JSON 粘贴）：
#   Settings → Secrets and variables → Actions → Variables → New variable
#   Name:  THEMES
#   Value: {"AI":{"sources":["https://..."],"keywords":""},"科技":{"sources":["https://..."],"keywords":""}}
#   - 键的顺序 = 推送顺序；sources 为该主题的新闻源（text 格式，多个用逗号）
#   - keywords 逗号分隔，留空 = 推送该主题全部条目；非空 = 只推含任一关键词的条目（无匹配则跳过该主题）
#   - 不配置 THEMES 时使用内置默认（AI→AI资讯、科技→IT资讯；eVtol/股市 待你提供新闻源）
#
# 手动测试：Actions 页面 → Run workflow（无需等定时）
# ============================================================

on:
  schedule:
    # 每天北京时间上午 10:00 推送（GitHub cron 用 UTC：02:00 UTC = 10:00 北京）
    - cron: '0 2 * * *'
  workflow_dispatch: # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: read

concurrency:
  group: push-news
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 抓取各主题新闻并推送到 Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 主题配置 JSON（单行粘贴，见文件头注释）
          THEMES: ${{ vars.THEMES }}
        run: |
          python3 - <<'PYEOF'
          import html, json, os, re, sys, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("CHAT_ID", "").strip()
          THEMES_RAW = (os.environ.get("THEMES") or "").strip()

          ITEM_RE = re.compile(r"^\s*\d+\.\s*")  # "1. xxx" 条目行

          def bj_now():
              return datetime.now(timezone.utc) + timedelta(hours=8)

          def fetch(url, timeout=30):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read().decode("utf-8", errors="replace")

          def tg_send(text):
              data = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage", data=data)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except Exception as e:
                  return None, str(e)

          # 内置默认主题（未配置 THEMES 时使用；eVtol/股市 等你提供源后填进 THEMES）
          DEFAULT_THEMES = json.dumps({
              "AI":   {"sources": ["https://60s.viki.moe/v2/ai-news?encoding=text"], "keywords": ""},
              "科技":  {"sources": ["https://60s.viki.moe/v2/it-news?encoding=text&limit=20"], "keywords": ""},
              "eVtol": {"sources": [], "keywords": ""},
              "股市":  {"sources": [], "keywords": ""},
          }, ensure_ascii=False)

          if not BOT_TOKEN or not CHAT_ID:
              print("::error::请先在仓库 Settings → Secrets 添加 BOT_TOKEN 和 CHAT_ID")
              sys.exit(1)

          try:
              themes = json.loads(THEMES_RAW) if THEMES_RAW else json.loads(DEFAULT_THEMES)
          except Exception as e:
              print(f"::error::THEMES JSON 解析失败（检查是否为合法 JSON 且单行）: {e}")
              sys.exit(1)
          if not isinstance(themes, dict) or not themes:
              print("::error::THEMES 必须是非空 JSON 对象")
              sys.exit(1)

          now = bj_now()
          week_cn = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"][now.weekday()]
          date_label = f"{now.strftime('%Y年%m月%d日')} · {week_cn}"

          success = 0
          for name, cfg in themes.items():
              sources = (cfg.get("sources") if isinstance(cfg, dict) else None) or []
              keywords = ((cfg.get("keywords") if isinstance(cfg, dict) else None) or "").strip()
              print(f"[{name}] 开始处理，源数: {len(sources)}")
              merged = ""
              for url in sources:
                  url = str(url).strip()
                  if not url:
                      continue
                  try:
                      text = fetch(url)
                      merged += text + "\n\n"
                      print(f"  ✓ 源获取成功 ({len(text)} 字符): {url}")
                  except Exception as e:
                      print(f"  ✗ 源获取失败: {url} → {e}")
              if not merged.strip():
                  print(f"[{name}] 无可用内容，跳过")
                  continue

              # 提取条目 + 关键词筛选（无匹配则跳过该主题，避免标题与内容不符）
              items = [ln.strip() for ln in merged.splitlines() if ITEM_RE.match(ln)]
              if keywords:
                  kw = [k.strip().lower() for k in keywords.split(",") if k.strip()]
                  if kw:
                      matched = [ln for ln in items if any(k in ln.lower() for k in kw)]
                      print(f"[{name}] 关键词 {keywords!r} → 匹配 {len(matched)}/{len(items)} 条")
                      if not matched:
                          print(f"[{name}] 无匹配，跳过该主题")
                          continue
                      items = matched

              # 重新编号 + 截断（Telegram 单条上限 4096 字符）
              body = "\n".join(f"{i+1}. {ITEM_RE.sub('', ln).strip()}" for i, ln in enumerate(items))
              body = body[:3900].strip()
              if not body:
                  print(f"[{name}] 内容为空，跳过")
                  continue

              header = f"📰 <b>{name} · {date_label}</b>"
              message = f"{header}\n\n{html.escape(body)}\n\n- via 60s API"
              status, resp = tg_send(message)
              if status == 200:
                  success += 1
                  print(f"[{name}] ✅ 已发送 ({len(body)} 字符)")
              else:
                  print(f"[{name}] ❌ 发送失败: HTTP {status} {resp}")

          if success == 0:
              print("::error::所有主题消息均发送失败")
              sys.exit(1)
          print(f"完成: {success}/{len(themes)} 个主题发送成功")
          PYEOF
